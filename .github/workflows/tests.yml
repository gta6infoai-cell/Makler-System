# Laeuft bei jeder Aenderung und prueft alle Bausteine. Kostenlos im Rahmen der GitHub-Freiminuten.
name: Tests
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alle Tests
        run: python -m unittest tests.test_bausteine tests.test_pruefpunkte tests.test_verfahren tests.test_ergaenzungen tests.test_entfernung
