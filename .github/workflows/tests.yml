# Laeuft bei jeder Aenderung und prueft alle Bausteine. Kostenlos im Rahmen der GitHub-Freiminuten.
name: Tests
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alle Tests (jede Datei tests/test_*.py wird automatisch gefunden)
        run: python -m unittest discover -s tests
      - name: Datenschutz - keine Kontonummern im Repository
        run: |
          if grep -rnIE "DE[0-9]{20}|DE[0-9]{2}( [0-9]{4}){4} [0-9]{2}" --exclude-dir=.git . ; then
            echo "Kontonummer gefunden - bitte entfernen"; exit 1
          fi
